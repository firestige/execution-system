name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Run the release-candidate publisher from the selected ref
        required: false
        default: false
        type: boolean
      candidate_tag:
        description: RC tag matching the stable package version
        required: false
        type: string
      authority_ref:
        description: Superproject release authority ref pinned to this component candidate
        required: false
        default: release/next
        type: string
      authority_manifest:
        description: Superproject-relative immutable unified candidate manifest
        required: false
        default: release/candidates/iter4-wave11.json
        type: string

concurrency:
  group: execution-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.release_candidate != true }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout superproject authority workspace
        uses: actions/checkout@v6
        with:
          repository: firestige/workflow-self-recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.authority_ref || 'main' }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify dispatched authority pins the exact Execution candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$(git ls-tree HEAD execution-system | awk '{print $3}')" = "$GITHUB_SHA"

      - name: Checkout execution-system
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: execution-system

      - name: Verify exact pull request candidate checkout
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git -C execution-system rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: execution-system/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Install dependencies
        working-directory: execution-system
        run: pnpm install --frozen-lockfile

      - name: Install frozen contract checker dependencies
        run: |
          npm --prefix system-contracts/workflow-dsl ci
          npm --prefix system-contracts/observation ci

      - name: Run full regression
        working-directory: execution-system
        run: pnpm test

      - name: Run coverage gate
        working-directory: execution-system
        run: pnpm test:coverage

      - name: Run static, generated, and build gates
        working-directory: execution-system
        run: |
          pnpm typecheck
          pnpm build
          pnpm check:generated
          pnpm harness static
          pnpm harness feasibility

  release-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    secrets: inherit
    with:
      candidate_tag: ${{ inputs.candidate_tag }}
      authority_ref: ${{ inputs.authority_ref }}
      authority_manifest: ${{ inputs.authority_manifest }}
