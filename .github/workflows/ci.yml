name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: execution-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout superproject authority workspace
        uses: actions/checkout@v6
        with:
          repository: firestige/workflow-self-recursive
          ref: main

      - name: Checkout execution-system
        uses: actions/checkout@v6
        with:
          path: execution-system

      - name: Checkout frozen Workflow Contract
        uses: actions/checkout@v6
        with:
          repository: firestige/system-contracts
          ref: c8e090f80073e3a4a37063d2d0165f190f2ec7f1
          path: system-contracts

      - name: Checkout canonical workflow-package
        uses: actions/checkout@v6
        with:
          repository: firestige/workflow-package
          ref: ed2a0bddda1eeaba77f19c5e543fe0c82d55fefb
          path: workflow-package

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: execution-system/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Install dependencies
        working-directory: execution-system
        run: pnpm install --frozen-lockfile

      - name: Install frozen contract checker dependencies
        run: |
          npm --prefix system-contracts/workflow-dsl ci
          npm --prefix system-contracts/observation ci

      - name: Run full regression
        working-directory: execution-system
        run: pnpm test

      - name: Run coverage gate
        working-directory: execution-system
        run: pnpm test:coverage

      - name: Run static, generated, and build gates
        working-directory: execution-system
        run: |
          pnpm typecheck
          pnpm build
          pnpm check:generated
          pnpm harness static
          pnpm harness feasibility
