name: Release candidate

on:
  push:
    branches:
      - release/next

permissions:
  contents: read

concurrency:
  group: execution-release-candidate
  cancel-in-progress: false

jobs:
  qualify-and-publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify release trigger branch
        run: test "$GITHUB_REF_NAME" = "release/next"

      - name: Resolve immutable release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/release/request.json?ref=$GITHUB_SHA" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/release-request.json"
          CANDIDATE_TAG="$(jq -er .candidate_tag "$RUNNER_TEMP/release-request.json")"
          AUTHORITY_REF="$(jq -er .authority_ref "$RUNNER_TEMP/release-request.json")"
          AUTHORITY_MANIFEST="$(jq -er .authority_manifest "$RUNNER_TEMP/release-request.json")"
          test -n "$CANDIDATE_TAG" && test -n "$AUTHORITY_REF" && test -n "$AUTHORITY_MANIFEST"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "authority_ref=$AUTHORITY_REF" >> "$GITHUB_OUTPUT"
          echo "authority_manifest=$AUTHORITY_MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Checkout super-project qualification authority workspace
        uses: actions/checkout@v6
        with:
          repository: firestige/workflow-self-recursive
          ref: ${{ steps.request.outputs.authority_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact Execution candidate pin
        id: authority
        env:
          AUTHORITY_MANIFEST: ${{ steps.request.outputs.authority_manifest }}
        run: |
          case "$AUTHORITY_MANIFEST" in release/candidates/*.json) ;; *) exit 1 ;; esac
          ARCHIVE_COMMIT="$(jq -er .execution.candidate_archive_commit "$GITHUB_WORKSPACE/$AUTHORITY_MANIFEST")"
          test "$(git -C execution-system rev-parse HEAD)" = "$ARCHIVE_COMMIT"
          echo "archive_commit=$ARCHIVE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact publisher tooling revision
        uses: actions/checkout@v6
        with:
          repository: firestige/wsr-execution
          ref: ${{ github.sha }}
          path: release-publisher

      - name: Verify exact publisher tooling checkout
        run: test "$(git -C release-publisher rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: execution-system/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Install exact dependencies
        working-directory: execution-system
        run: pnpm install --frozen-lockfile

      - name: Install frozen contract checker dependencies
        run: |
          npm --prefix system-contracts/workflow-dsl-2-candidate ci
          npm --prefix system-contracts/observation ci

      - name: Validate coordinates and resolve resumable RC state
        id: candidate
        working-directory: execution-system
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RELEASE_TARGET: ${{ steps.authority.outputs.archive_commit }}
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          pnpm release:policy candidate "$CANDIDATE_TAG" "$PACKAGE_VERSION"
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$RELEASE_TARGET"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" >/dev/null 2>&1; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$RELEASE_TARGET"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full component gates
        working-directory: execution-system
        run: |
          pnpm test:full
          pnpm test:coverage
          pnpm typecheck
          pnpm build
          pnpm check:generated
          pnpm harness static
          pnpm harness feasibility

      - name: Materialize and verify exact unified-candidate artifacts
        working-directory: execution-system
        env:
          AUTHORITY_MANIFEST: ${{ steps.request.outputs.authority_manifest }}
          RELEASE_TARGET: ${{ steps.authority.outputs.archive_commit }}
        run: |
          case "$AUTHORITY_MANIFEST" in release/candidates/*.json) ;; *) exit 1 ;; esac
          CANDIDATE_DIR="$(dirname "$(jq -r .execution.metadata.path "$GITHUB_WORKSPACE/$AUTHORITY_MANIFEST")")"
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET"
          git diff --quiet "$RELEASE_TARGET" -- "${CANDIDATE_DIR#execution-system/}"
          node --import tsx "$GITHUB_WORKSPACE/release-publisher/scripts/materialize-unified-release-candidate.ts" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$AUTHORITY_MANIFEST" "$RUNNER_TEMP/local-release"
          pnpm release:verify "$RUNNER_TEMP/local-release"

      - name: Mint short-lived release App token after candidate qualification
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WSR_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.WSR_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: wsr-execution
          permission-contents: write
          permission-workflows: write

      - name: Create or resume RC with exact local assets
        working-directory: execution-system
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RC_EXISTS: ${{ steps.candidate.outputs.exists }}
          RELEASE_TARGET: ${{ steps.authority.outputs.archive_commit }}
        run: |
          if test "$RC_EXISTS" != true; then
            gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$RELEASE_TARGET" \
              --title "Execution System $CANDIDATE_TAG" \
              --notes-file "$RUNNER_TEMP/local-release/release-notes.md"
          fi
          mkdir "$RUNNER_TEMP/existing-assets"
          for FILE in "$RUNNER_TEMP/local-release/"*; do
            NAME="$(basename "$FILE")"
            if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$NAME"; then
              gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$FILE" "$RUNNER_TEMP/existing-assets/$NAME"
            else
              gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" "$FILE"
            fi
          done

      - name: Redownload exact prerelease assets
        working-directory: execution-system
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
        run: |
          mkdir "$RUNNER_TEMP/remote-release"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/remote-release"
          pnpm release:verify "$RUNNER_TEMP/remote-release"
          cmp "$RUNNER_TEMP/local-release/release-metadata.json" "$RUNNER_TEMP/remote-release/release-metadata.json"

      - name: Publish immutable qualification evidence to the prerelease
        working-directory: execution-system
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RELEASE_TARGET: ${{ steps.authority.outputs.archive_commit }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          METADATA_SHA="sha256:$(sha256sum "$RUNNER_TEMP/remote-release/release-metadata.json" | cut -d' ' -f1)"
          export VERSION METADATA_SHA
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({schemaVersion:"execution.release-qualification@1.0.0",packageVersion:process.env.VERSION,candidateTag:process.env.CANDIDATE_TAG,commit:process.env.RELEASE_TARGET,publisherRevision:process.env.GITHUB_SHA,artifactMetadataSha256:process.env.METADATA_SHA,componentGates:{status:"PASS"},remoteArtifactVerification:{status:"PASS"}},null,2)+"\n")' \
            "$RUNNER_TEMP/release-qualification.json"
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq release-qualification.json; then
            mkdir "$RUNNER_TEMP/existing-qualification"
            gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-qualification.json --dir "$RUNNER_TEMP/existing-qualification"
            cmp "$RUNNER_TEMP/release-qualification.json" "$RUNNER_TEMP/existing-qualification/release-qualification.json"
          else
            gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-qualification.json"
          fi
