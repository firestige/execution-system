<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f93bd"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4D6BFE"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>
  <rect x="0" y="0" width="8" height="900" fill="url(#accent)"/>

  <!-- title -->
  <text x="60" y="70" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#ffffff">Workflow Self-Recursive — Architecture</text>
  <text x="60" y="105" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="18" fill="#7f93bd">Execution · Evidence · Evolution closed loop · DSH Intake entry</text>

  <!-- user + DSH -->
  <g font-family="'SF Pro Display','Segoe UI',sans-serif">
    <rect x="60" y="150" width="180" height="70" rx="12" fill="#1a2b4d" stroke="#4D6BFE" stroke-opacity="0.7" stroke-width="1.4"/>
    <text x="150" y="192" text-anchor="middle" fill="#dbe4f5" font-size="18">User</text>
    <rect x="290" y="150" width="260" height="70" rx="12" fill="#1a2b4d" stroke="#2DD4BF" stroke-opacity="0.7" stroke-width="1.4"/>
    <text x="420" y="186" text-anchor="middle" fill="#dbe4f5" font-size="18">DSH host (web / headless)</text>
    <text x="420" y="208" text-anchor="middle" fill="#7f93bd" font-size="13">chat · sidebar · commands</text>
    <line x1="240" y1="185" x2="288" y2="185" stroke="#7f93bd" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- DSH Intake -->
  <g font-family="'SF Pro Display','Segoe UI',sans-serif">
    <rect x="290" y="280" width="260" height="150" rx="12" fill="#142038" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="420" y="312" text-anchor="middle" fill="#cbbcfb" font-size="17" font-weight="600">DSH Execution · dsh-wsr-execution</text>
    <text x="308" y="340" fill="#9fb3d9" font-size="14">/wsr commands (DSH-I)</text>
    <text x="308" y="364" fill="#9fb3d9" font-size="14">/workflow-execution skill</text>
    <text x="308" y="388" fill="#9fb3d9" font-size="14">sidebar Deliveries / Current</text>
    <text x="308" y="412" fill="#5b7199" font-size="12">never controls execution</text>
    <line x1="420" y1="220" x2="420" y2="278" stroke="#7f93bd" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- Execution System -->
  <g font-family="'SF Pro Display','Segoe UI',sans-serif">
    <rect x="620" y="160" width="560" height="330" rx="14" fill="#101b33" stroke="#4D6BFE" stroke-width="2"/>
    <text x="900" y="196" text-anchor="middle" fill="#a9c0ff" font-size="19" font-weight="600">Execution System — embedded per repository/workspace</text>

    <rect x="660" y="220" width="230" height="90" rx="10" fill="#16233f" stroke="#4D6BFE" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="775" y="252" text-anchor="middle" fill="#dbe4f5" font-size="16">M01 Delivery</text>
    <text x="775" y="274" text-anchor="middle" fill="#7f93bd" font-size="12">admission · binding · manifest</text>
    <text x="775" y="294" text-anchor="middle" fill="#7f93bd" font-size="12">immutable Delivery Manifest</text>

    <rect x="660" y="330" width="230" height="90" rx="10" fill="#16233f" stroke="#4D6BFE" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="775" y="362" text-anchor="middle" fill="#dbe4f5" font-size="16">M02 Runner</text>
    <text x="775" y="384" text-anchor="middle" fill="#7f93bd" font-size="12">isolated execution (DSH-E)</text>
    <text x="775" y="404" text-anchor="middle" fill="#7f93bd" font-size="12">LangGraph host · DSH provider</text>

    <rect x="660" y="440" width="230" height="40" rx="10" fill="#16233f" stroke="#4D6BFE" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="775" y="466" text-anchor="middle" fill="#dbe4f5" font-size="15">M03 Observation (OTLP)</text>

    <line x1="775" y1="310" x2="775" y2="328" stroke="#4D6BFE" stroke-width="1.4" marker-end="url(#arrowAccent)"/>
    <line x1="775" y1="420" x2="775" y2="438" stroke="#4D6BFE" stroke-width="1.4" marker-end="url(#arrowAccent)"/>

    <!-- recovery -->
    <rect x="940" y="220" width="210" height="50" rx="10" fill="#142038" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="1045" y="251" text-anchor="middle" fill="#7fe8d8" font-size="14">crash recovery</text>
    <rect x="940" y="290" width="210" height="50" rx="10" fill="#142038" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="1045" y="321" text-anchor="middle" fill="#7fe8d8" font-size="14">manifest / current-slot persist</text>
    <rect x="940" y="360" width="210" height="50" rx="10" fill="#142038" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="1045" y="391" text-anchor="middle" fill="#7fe8d8" font-size="14">bounded observations</text>
    <rect x="940" y="430" width="210" height="50" rx="10" fill="#142038" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="1045" y="461" text-anchor="middle" fill="#7fe8d8" font-size="14">no dependency on Evidence</text>

    <line x1="550" y1="355" x2="658" y2="355" stroke="#7f93bd" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- Source -->
  <g font-family="'SF Pro Display','Segoe UI',sans-serif">
    <rect x="1240" y="240" width="300" height="80" rx="12" fill="#142038" stroke="#7f93bd" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="1390" y="276" text-anchor="middle" fill="#dbe4f5" font-size="16">Workflow Package Release</text>
    <text x="1390" y="298" text-anchor="middle" fill="#7f93bd" font-size="12">exact version + sha256 · one Source Adapter</text>
    <line x1="1240" y1="280" x2="1182" y2="280" stroke="#7f93bd" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- Evidence -->
  <g font-family="'SF Pro Display','Segoe UI',sans-serif">
    <rect x="620" y="560" width="620" height="240" rx="14" fill="#101b33" stroke="#2DD4BF" stroke-width="2"/>
    <text x="930" y="596" text-anchor="middle" fill="#7fe8d8" font-size="19" font-weight="600">Evidence System — optional local App</text>

    <rect x="660" y="620" width="230" height="70" rx="10" fill="#16233f" stroke="#2DD4BF" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="775" y="652" text-anchor="middle" fill="#dbe4f5" font-size="15">Evidence App</text>
    <text x="775" y="674" text-anchor="middle" fill="#7f93bd" font-size="12">observation admission</text>

    <rect x="940" y="620" width="150" height="70" rx="10" fill="#16233f" stroke="#2DD4BF" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="1015" y="652" text-anchor="middle" fill="#dbe4f5" font-size="15">PostgreSQL</text>
    <text x="1015" y="674" text-anchor="middle" fill="#7f93bd" font-size="12">factual projection</text>

    <rect x="660" y="710" width="230" height="60" rx="10" fill="#16233f" stroke="#2DD4BF" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="775" y="744" text-anchor="middle" fill="#dbe4f5" font-size="15">Grafana trends</text>
    <rect x="940" y="710" width="230" height="60" rx="10" fill="#16233f" stroke="#2DD4BF" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="1055" y="744" text-anchor="middle" fill="#dbe4f5" font-size="15">Agent Decisions trace</text>

    <line x1="892" y1="655" x2="938" y2="655" stroke="#2DD4BF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="775" y1="690" x2="775" y2="708" stroke="#2DD4BF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="1015" y1="690" x2="1015" y2="708" stroke="#2DD4BF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="1015" y1="655" x2="1015" y2="690" stroke="#2DD4BF" stroke-width="1.2"/>
  </g>

  <!-- OTLP edge -->
  <g font-family="'SF Pro Display','Segoe UI',sans-serif">
    <path d="M900 490 C 900 520, 800 525, 810 558" stroke="#4D6BFE" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)" stroke-dasharray="6 5"/>
    <text x="920" y="525" fill="#5b7199" font-size="13">bounded OTLP facts</text>
  </g>

  <!-- footnote -->
  <text x="60" y="860" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="15" fill="#4a5f8a">DSH Intake never controls execution · Evidence never controls execution · Execution continues when Evidence or telemetry is unavailable</text>
</svg>
